# Render configuration for deploying the Bangla OCR API backend.

services:
  - type: web
    name: bangla-ocr-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: bangla-ocr-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://bangla-ocr-ui.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bangla-ocr-db
          property: connectionString

databases:
  - name: bangla-ocr-db
    plan: free